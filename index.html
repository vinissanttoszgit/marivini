<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Marivini</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/modals.css" />
    <link rel="stylesheet" href="./css/habits.css" />
    <link rel="stylesheet" href="./css/calendar.css" />
  </head>
  <body>
    <div class="app-frame">
      <div class="app-shell" id="app-shell">
        <header class="app-header">
          <div>
            <p class="eyebrow" id="page-eyebrow" hidden></p>
            <h1 class="page-title page-title--flush" id="page-title">Hábitos</h1>
            <p class="page-subtitle" id="page-subtitle" hidden></p>
          </div>
          <button class="icon-button" id="settings-trigger" aria-label="Abrir configurações">
            <span>⚙️</span>
          </button>
        </header>
        <main class="page-content" id="page-root" aria-live="polite">
          <div class="card loading-state">
            <div class="loading-state__header">
              <div class="loading-state__line loading-state__line--title"></div>
              <div class="loading-state__line loading-state__line--pill"></div>
            </div>
            <div class="loading-state__line loading-state__line--body"></div>
            <div class="loading-state__line loading-state__line--body loading-state__line--short"></div>
          </div>
        </main>
        <nav id="bottom-nav"></nav>
      </div>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root"></div>

    <script>
      (function () {
        const activeTab = window.localStorage.getItem("marivini:active-tab");
        const pageTitle = document.getElementById("page-title");
        if (activeTab === "calendar" && pageTitle) {
          pageTitle.textContent = "Calendário";
        }
      })();
    </script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
